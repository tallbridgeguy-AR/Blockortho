<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Orthographic Drawing Practice Tool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      /* Prevents touch selection flickering on mobile */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      padding: 15px;
    }
    h1 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 1.4rem;
    }
    .app-container {
      display: flex;
      flex-direction: row;
      gap: 15px;
      max-width: 1000px;
      margin: 0 auto;
    }
    @media (max-width: 768px) {
      .app-container {
        flex-direction: column;
        align-items: center;
      }
    }
    .panel {
      background: #ffffff;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .right-panel {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 15px;
      width: 100%;
    }
    canvas {
      background-color: #fafafa;
      border: 1px dashed #ccc;
      border-radius: 4px;
      cursor: crosshair;
      /* Prevents iPad drag/scroll gesture while drawing */
      touch-action: none; 
    }
    .grid-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .grid-title {
      font-weight: bold;
      margin-bottom: 5px;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 18px;
      background-color: #e53e3e;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:active {
      background-color: #c53030;
    }
  </style>
</head>
<body>

  <h1>Orthographic Drawing Practice Tool</h1>

  <div class="app-container">
    <!-- Left Panel: Solid Reference -->
    <div class="panel left-panel">
      <div class="grid-title">Solid Block Reference</div>
      <canvas id="isoCanvas" width="300" height="300"></canvas>
      <div class="controls">
        <button id="clearAllBtn">Reset Drawing</button>
      </div>
    </div>

    <!-- Right Panel: Orthographic Grid Area -->
    <div class="panel right-panel">
      <div class="grid-box">
        <div class="grid-title">Top View</div>
        <canvas id="topCanvas" width="160" height="160"></canvas>
      </div>
      <div class="grid-box" style="justify-content: center; text-align: center; color: #777; font-size: 0.75rem;">
        <p>Touch or click dots to draw.</p>
      </div>
      <div class="grid-box">
        <div class="grid-title">Front View</div>
        <canvas id="frontCanvas" width="160" height="160"></canvas>
      </div>
      <div class="grid-box">
        <div class="grid-title">Right View</div>
        <canvas id="rightCanvas" width="160" height="160"></canvas>
      </div>
    </div>
  </div>

  <script>
    // 3D Isometric Reference Rendering
    const isoCanvas = document.getElementById('isoCanvas');
    const isoCtx = isoCanvas.getContext('2d');

    function drawIsometricBlock() {
      isoCtx.clearRect(0, 0, isoCanvas.width, isoCanvas.height);
      const cx = 150, cy = 210, scale = 24;

      function project(x, y, z) {
        return {
          x: cx + (x - y) * Math.cos(Math.PI / 6) * scale,
          y: cy - z * scale + (x + y) * Math.sin(Math.PI / 6) * scale
        };
      }

      const polygons = [
        { pts: [[0,0,0], [2,0,0], [2,2,0], [0,2,0]], color: '#e0e0e0' },
        { pts: [[0,0,0], [2,0,0], [2,0,2], [0,0,2]], color: '#ffffff' },
        { pts: [[0,0,2], [2,0,2], [2,2,2], [0,2,2]], color: '#f0f0f0' },
        { pts: [[0,2,2], [2,2,2], [2,2,4], [0,2,4]], color: '#ffffff' },
        { pts: [[0,2,4], [2,2,4], [2,4,4], [0,4,4]], color: '#f5f5f5' },
        { pts: [[2,0,0], [2,2,0], [2,2,2], [2,0,2]], color: '#cccccc' },
        { pts: [[2,2,0], [2,4,0], [2,4,4], [2,2,4]], color: '#cccccc' }
      ];

      polygons.forEach(poly => {
        isoCtx.beginPath();
        poly.pts.forEach((pt, idx) => {
          const p = project(pt[0], pt[1], pt[2]);
          if (idx === 0) isoCtx.moveTo(p.x, p.y);
          else isoCtx.lineTo(p.x, p.y);
        });
        isoCtx.closePath();
        isoCtx.fillStyle = poly.color;
        isoCtx.fill();
        isoCtx.strokeStyle = '#222';
        isoCtx.lineWidth = 2;
        isoCtx.stroke();
      });
    }
    drawIsometricBlock();

    // Cross-Platform Drawing Grid (Mouse + Touch / Apple Pencil)
    const GRID_SPACING = 20;
    const GRID_ROWS = 7;
    const GRID_COLS = 7;
    const OFFSET = 20;

    class DrawingGrid {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.lines = [];
        this.isDrawing = false;
        this.startPoint = null;
        this.currentPoint = null;

        // Mouse Listeners
        this.canvas.addEventListener('mousedown', this.start.bind(this));
        this.canvas.addEventListener('mousemove', this.move.bind(this));
        this.canvas.addEventListener('mouseup', this.end.bind(this));

        // Touch Listeners (for iPad / Touchscreen)
        this.canvas.addEventListener('touchstart', this.start.bind(this), { passive: false });
        this.canvas.addEventListener('touchmove', this.move.bind(this), { passive: false });
        this.canvas.addEventListener('touchend', this.end.bind(this), { passive: false });

        this.render();
      }

      getPos(e) {
        const rect = this.canvas.getBoundingClientRect();
        let clientX = e.clientX;
        let clientY = e.clientY;

        // Use touch coordinate if available
        if (e.touches && e.touches.length > 0) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        }

        const rawX = clientX - rect.left;
        const rawY = clientY - rect.top;

        // Snap to grid
        const col = Math.max(0, Math.min(GRID_COLS - 1, Math.round((rawX - OFFSET) / GRID_SPACING)));
        const row = Math.max(0, Math.min(GRID_ROWS - 1, Math.round((rawY - OFFSET) / GRID_SPACING)));

        return { x: OFFSET + col * GRID_SPACING, y: OFFSET + row * GRID_SPACING };
      }

      start(e) {
        e.preventDefault();
        this.startPoint = this.getPos(e);
        this.currentPoint = this.startPoint;
        this.isDrawing = true;
      }

      move(e) {
        if (!this.isDrawing) return;
        e.preventDefault();
        this.currentPoint = this.getPos(e);
        this.render();
      }

      end(e) {
        if (this.isDrawing) {
          if (this.startPoint.x !== this.currentPoint.x || this.startPoint.y !== this.currentPoint.y) {
            this.lines.push({ p1: this.startPoint, p2: this.currentPoint });
          }
          this.isDrawing = false;
          this.render();
        }
      }

      clear() {
        this.lines = [];
        this.render();
      }

      render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        // Draw Dot Grid
        for (let r = 0; r < GRID_ROWS; r++) {
          for (let c = 0; c < GRID_COLS; c++) {
            this.ctx.beginPath();
            this.ctx.arc(OFFSET + c * GRID_SPACING, OFFSET + r * GRID_SPACING, 2, 0, Math.PI * 2);
            this.ctx.fillStyle = '#666';
            this.ctx.fill();
          }
        }

        // Draw User Lines
        this.ctx.strokeStyle = '#000';
        this.ctx.lineWidth = 3;
        this.ctx.lineCap = 'round';
        this.lines.forEach(line => {
          this.ctx.beginPath();
          this.ctx.moveTo(line.p1.x, line.p1.y);
          this.ctx.lineTo(line.p2.x, line.p2.y);
          this.ctx.stroke();
        });

        // Active rubber-band line
        if (this.isDrawing) {
          this.ctx.strokeStyle = '#0066cc';
          this.ctx.beginPath();
          this.ctx.moveTo(this.startPoint.x, this.startPoint.y);
          this.ctx.lineTo(this.currentPoint.x, this.currentPoint.y);
          this.ctx.stroke();
        }
      }
    }

    const topGrid = new DrawingGrid('topCanvas');
    const frontGrid = new DrawingGrid('frontCanvas');
    const rightGrid = new DrawingGrid('rightCanvas');

    document.getElementById('clearAllBtn').addEventListener('click', () => {
      topGrid.clear();
      frontGrid.clear();
      rightGrid.clear();
    });
  </script>
</body>
</html>

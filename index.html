<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Orthographic Drawing Practice Tool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      padding: 15px;
    }
    h1 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 1.4rem;
    }
    .app-container {
      display: flex;
      flex-direction: row;
      gap: 15px;
      max-width: 1050px;
      margin: 0 auto;
    }
    @media (max-width: 768px) {
      .app-container {
        flex-direction: column;
        align-items: center;
      }
    }
    .panel {
      background: #ffffff;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .right-panel {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 15px;
      width: 100%;
    }
    canvas {
      background-color: #fafafa;
      border: 1px dashed #ccc;
      border-radius: 4px;
      touch-action: none; 
    }
    #isoCanvas {
      cursor: grab;
    }
    #isoCanvas:active {
      cursor: grabbing;
    }
    .grid-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .grid-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 160px;
      margin-bottom: 5px;
    }
    .grid-title {
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }
    .mini-btn {
      padding: 2px 6px;
      background-color: #718096;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      cursor: pointer;
    }
    .mini-btn:hover {
      background-color: #4a5568;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    button.main-btn {
      padding: 10px 16px;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .check-btn { background-color: #38a169; }
    .check-btn:hover { background-color: #2f855a; }
    .clear-btn { background-color: #e53e3e; }
    .clear-btn:hover { background-color: #c53030; }
    .reset-cam-btn { background-color: #4a5568; }
    .reset-cam-btn:hover { background-color: #2d3748; }
    
    #feedback {
      margin-top: 10px;
      font-weight: bold;
      font-size: 0.95rem;
      text-align: center;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <h1>Orthographic Drawing Practice Tool</h1>

  <div class="app-container">
    <!-- Left Panel: Rotatable 3D Solid Reference -->
    <div class="panel left-panel">
      <div class="grid-title" style="margin-bottom: 5px;">Solid Block Reference</div>
      <canvas id="isoCanvas" width="320" height="300"></canvas>
      <div id="feedback"></div>
      <div class="controls">
        <button id="checkBtn" class="main-btn check-btn">Check Answer</button>
        <button id="clearAllBtn" class="main-btn clear-btn">Reset Drawing</button>
        <button id="resetCamBtn" class="main-btn reset-cam-btn">Reset View</button>
      </div>
    </div>

    <!-- Right Panel: Orthographic Grids -->
    <div class="panel right-panel">
      <!-- Top View -->
      <div class="grid-box">
        <div class="grid-header">
          <span class="grid-title" style="color: #2b6cb0;">Top View</span>
          <button class="mini-btn" onclick="topGrid.undo()">Undo</button>
        </div>
        <canvas id="topCanvas" width="160" height="160"></canvas>
      </div>

      <!-- Info panel -->
      <div class="grid-box" style="justify-content: center; text-align: center; color: #555; font-size: 0.75rem;">
        <p><strong>Instructions:</strong></p>
        <p>Drag on the left block to spin it in 3D.</p>
        <p>Drag dots on grids to draw lines.</p>
      </div>

      <!-- Front View -->
      <div class="grid-box">
        <div class="grid-header">
          <span class="grid-title" style="color: #c53030;">Front View</span>
          <button class="mini-btn" onclick="frontGrid.undo()">Undo</button>
        </div>
        <canvas id="frontCanvas" width="160" height="160"></canvas>
      </div>

      <!-- Right View -->
      <div class="grid-box">
        <div class="grid-header">
          <span class="grid-title" style="color: #d69e2e;">Right View</span>
          <button class="mini-btn" onclick="rightGrid.undo()">Undo</button>
        </div>
        <canvas id="rightCanvas" width="160" height="160"></canvas>
      </div>
    </div>
  </div>

  <script>
    // --- 1. True 3D Solid Engine with Rotatable View ---
    const isoCanvas = document.getElementById('isoCanvas');
    const isoCtx = isoCanvas.getContext('2d');

    // Default isometric camera angles
    const DEFAULT_ROT_X = 0.5;
    const DEFAULT_ROT_Y = -0.6;

    let rotX = DEFAULT_ROT_X;
    let rotY = DEFAULT_ROT_Y;
    let isDraggingCam = false;
    let lastMouseX = 0, lastMouseY = 0;

    // Define 3D Mesh for Solid Step Block (centered at origin)
    const rawPolygons = [
      // Bottom face
      { pts: [[-1,0,-2], [1,0,-2], [1,0,2], [-1,0,2]], color: '#cbd5e0', label: '' },
      // Back face
      { pts: [[-1,0,-2], [1,0,-2], [1,4,-2], [-1,4,-2]], color: '#a0aec0', label: '' },
      // Front lower face (FRONT)
      { pts: [[-1,0,2], [1,0,2], [1,2,2], [-1,2,2]], color: '#feb2b2', norm: [0,0,1] },
      // Step riser face (FRONT)
      { pts: [[-1,2,0], [1,2,0], [1,4,0], [-1,4,0]], color: '#feb2b2', norm: [0,0,1] },
      // Step tread face (TOP)
      { pts: [[-1,2,0], [1,2,0], [1,2,2], [-1,2,2]], color: '#bee3f8', norm: [0,1,0] },
      // Top tread face (TOP)
      { pts: [[-1,4,-2], [1,4,-2], [1,4,0], [-1,4,0]], color: '#bee3f8', norm: [0,1,0] },
      // Left side face (full profile)
      { pts: [[-1,0,-2], [-1,0,2], [-1,2,2], [-1,2,0], [-1,4,0], [-1,4,-2]], color: '#e2e8f0', label: '' },
      // Right lower face (RIGHT)
      { pts: [[1,0,0], [1,0,2], [1,2,2], [1,2,0]], color: '#fefcbf', norm: [1,0,0] },
      // Right upper face (RIGHT)
      { pts: [[1,0,-2], [1,0,0], [1,4,0], [1,4,-2]], color: '#fefcbf', norm: [1,0,0] }
    ];

    function rotate3D(x, y, z, rx, ry) {
      // Y-axis rotation
      let x1 = x * Math.cos(ry) + z * Math.sin(ry);
      let z1 = -x * Math.sin(ry) + z * Math.cos(ry);
      let y1 = y;

      // X-axis rotation
      let y2 = y1 * Math.cos(rx) - z1 * Math.sin(rx);
      let z2 = y1 * Math.sin(rx) + z1 * Math.cos(rx);

      return { x: x1, y: y2, z: z2 };
    }

    function drawIsometricBlock() {
      isoCtx.clearRect(0, 0, isoCanvas.width, isoCanvas.height);
      const cx = isoCanvas.width / 2;
      const cy = isoCanvas.height / 2 + 20;
      const scale = 32;

      // Project & calculate face depths for painter's algorithm
      let projectedPolys = rawPolygons.map(poly => {
        let transformedPts = poly.pts.map(pt => {
          let r = rotate3D(pt[0], pt[1], pt[2], rotX, rotY);
          return {
            x: cx + r.x * scale,
            y: cy - r.y * scale,
            z: r.z
          };
        });

        // Average Z-depth for sorting back-to-front
        let avgZ = transformedPts.reduce((sum, p) => sum + p.z, 0) / transformedPts.length;

        return {
          pts: transformedPts,
          color: poly.color,
          avgZ: avgZ
        };
      });

      // Sort faces back-to-front (solid occlusion)
      projectedPolys.sort((a, b) => a.avgZ - b.avgZ);

      // Render solid faces
      projectedPolys.forEach(poly => {
        isoCtx.beginPath();
        poly.pts.forEach((p, idx) => {
          if (idx === 0) isoCtx.moveTo(p.x, p.y);
          else isoCtx.lineTo(p.x, p.y);
        });
        isoCtx.closePath();
        isoCtx.fillStyle = poly.color;
        isoCtx.fill();
        isoCtx.strokeStyle = '#1a202c';
        isoCtx.lineWidth = 2;
        isoCtx.stroke();
      });

      // Render Clear External Labels around Model
      drawViewLabels(cx, cy, scale);
    }

    function drawViewLabels(cx, cy, scale) {
      // Position indicators clearly outside the block in 3D space
      const labels = [
        { text: 'FRONT VIEW →', pos: [0, 1, 3.8], color: '#c53030' },
        { text: 'TOP VIEW ↓', pos: [0, 5.2, -1], color: '#2b6cb0' },
        { text: '← RIGHT VIEW', pos: [3.2, 1, 0], color: '#d69e2e' }
      ];

      isoCtx.font = 'bold 12px sans-serif';
      isoCtx.textAlign = 'center';

      labels.forEach(lbl => {
        let p = rotate3D(lbl.pos[0], lbl.pos[1], lbl.pos[2], rotX, rotY);
        let screenX = cx + p.x * scale;
        let screenY = cy - p.y * scale;

        // Label background badge
        isoCtx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        let textWidth = isoCtx.measureText(lbl.text).width;
        isoCtx.fillRect(screenX - textWidth/2 - 4, screenY - 10, textWidth + 8, 16);

        // Label text
        isoCtx.fillStyle = lbl.color;
        isoCtx.fillText(lbl.text, screenX, screenY + 2);
      });
    }

    // Camera Interaction Handlers (Mouse & Touch Drag to Rotate)
    function startCamDrag(e) {
      isDraggingCam = true;
      let pos = getEventPos(e);
      lastMouseX = pos.x;
      lastMouseY = pos.y;
    }

    function moveCamDrag(e) {
      if (!isDraggingCam) return;
      let pos = getEventPos(e);
      let dx = pos.x - lastMouseX;
      let dy = pos.y - lastMouseY;

      rotY += dx * 0.01;
      rotX += dy * 0.01;

      // Limit vertical rotation to prevent flipping
      rotX = Math.max(-1.2, Math.min(1.2, rotX));

      lastMouseX = pos.x;
      lastMouseY = pos.y;

      drawIsometricBlock();
    }

    function endCamDrag() {
      isDraggingCam = false;
    }

    function getEventPos(e) {
      let rect = isoCanvas.getBoundingClientRect();
      let clientX = e.clientX, clientY = e.clientY;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      }
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    isoCanvas.addEventListener('mousedown', startCamDrag);
    window.addEventListener('mousemove', moveCamDrag);
    window.addEventListener('mouseup', endCamDrag);

    isoCanvas.addEventListener('touchstart', startCamDrag, { passive: false });
    window.addEventListener('touchmove', moveCamDrag, { passive: false });
    window.addEventListener('touchend', endCamDrag, { passive: false });

    document.getElementById('resetCamBtn').addEventListener('click', () => {
      rotX = DEFAULT_ROT_X;
      rotY = DEFAULT_ROT_Y;
      drawIsometricBlock();
    });

    drawIsometricBlock();

    // --- 2. Interactive Grid Drawing Engine ---
    const GRID_SPACING = 20;
    const GRID_ROWS = 7;
    const GRID_COLS = 7;
    const OFFSET = 20;

    class DrawingGrid {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.lines = [];
        this.isDrawing = false;
        this.startPoint = null;
        this.currentPoint = null;

        this.canvas.addEventListener('mousedown', this.start.bind(this));
        this.canvas.addEventListener('mousemove', this.move.bind(this));
        this.canvas.addEventListener('mouseup', this.end.bind(this));

        this.canvas.addEventListener('touchstart', this.start.bind(this), { passive: false });
        this.canvas.addEventListener('touchmove', this.move.bind(this), { passive: false });
        this.canvas.addEventListener('touchend', this.end.bind(this), { passive: false });

        this.render();
      }

      getPos(e) {
        const rect = this.canvas.getBoundingClientRect();
        let clientX = e.clientX, clientY = e.clientY;

        if (e.touches && e.touches.length > 0) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        }

        const col = Math.max(0, Math.min(GRID_COLS - 1, Math.round((clientX - rect.left - OFFSET) / GRID_SPACING)));
        const row = Math.max(0, Math.min(GRID_ROWS - 1, Math.round((clientY - rect.top - OFFSET) / GRID_SPACING)));

        return { col, row, x: OFFSET + col * GRID_SPACING, y: OFFSET + row * GRID_SPACING };
      }

      start(e) {
        e.preventDefault();
        this.startPoint = this.getPos(e);
        this.currentPoint = this.startPoint;
        this.isDrawing = true;
      }

      move(e) {
        if (!this.isDrawing) return;
        e.preventDefault();
        this.currentPoint = this.getPos(e);
        this.render();
      }

      end(e) {
        if (this.isDrawing) {
          if (this.startPoint.col !== this.currentPoint.col || this.startPoint.row !== this.currentPoint.row) {
            this.lines.push({ p1: this.startPoint, p2: this.currentPoint });
          }
          this.isDrawing = false;
          this.render();
        }
      }

      undo() {
        this.lines.pop();
        this.render();
      }

      clear() {
        this.lines = [];
        this.render();
      }

      render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        // Dot Grid
        for (let r = 0; r < GRID_ROWS; r++) {
          for (let c = 0; c < GRID_COLS; c++) {
            this.ctx.beginPath();
            this.ctx.arc(OFFSET + c * GRID_SPACING, OFFSET + r * GRID_SPACING, 2, 0, Math.PI * 2);
            this.ctx.fillStyle = '#666';
            this.ctx.fill();
          }
        }

        // Lines
        this.ctx.strokeStyle = '#000';
        this.ctx.lineWidth = 3;
        this.ctx.lineCap = 'round';
        this.lines.forEach(l => {
          this.ctx.beginPath();
          this.ctx.moveTo(l.p1.x, l.p1.y);
          this.ctx.lineTo(l.p2.x, l.p2.y);
          this.ctx.stroke();
        });

        // Rubberband line preview
        if (this.isDrawing) {
          this.ctx.strokeStyle = '#0066cc';
          this.ctx.beginPath();
          this.ctx.moveTo(this.startPoint.x, this.startPoint.y);
          this.ctx.lineTo(this.currentPoint.x, this.currentPoint.y);
          this.ctx.stroke();
        }
      }
    }

    const topGrid = new DrawingGrid('topCanvas');
    const frontGrid = new DrawingGrid('frontCanvas');
    const rightGrid = new DrawingGrid('rightCanvas');

    // --- 3. Solution Verification Engine ---
    const TARGET_SOLUTIONS = {
      top: [
        [[1,1],[3,1]], [[3,1],[3,5]], [[3,5],[1,5]], [[1,5],[1,1]],
        [[1,3],[3,3]]
      ],
      front: [
        [[1,5],[3,5]], [[3,5],[3,1]], [[3,1],[2,1]],
        [[2,1],[2,3]], [[2,3],[1,3]], [[1,3],[1,5]],
        [[2,3],[3,3]]
      ],
      right: [
        [[1,1],[5,1]], [[5,1],[5,5]], [[5,5],[1,5]], [[1,5],[1,1]],
        [[1,3],[5,3]]
      ]
    };

    function normalizeSegment(p1, p2) {
      if (p1.col < p2.col || (p1.col === p2.col && p1.row < p2.row)) {
        return `${p1.col},${p1.row}-${p2.col},${p2.row}`;
      }
      return `${p2.col},${p2.row}-${p1.col},${p1.row}`;
    }

    function checkAnswer() {
      const checkView = (userLines, targetLines) => {
        const userSet = new Set(userLines.map(l => normalizeSegment(l.p1, l.p2)));
        const targetSet = new Set(targetLines.map(l => normalizeSegment({col: l[0][0], row: l[0][1]}, {col: l[1][0], row: l[1][1]})));

        if (userSet.size !== targetSet.size) return false;
        for (let seg of userSet) {
          if (!targetSet.has(seg)) return false;
        }
        return true;
      };

      const topOk = checkView(topGrid.lines, TARGET_SOLUTIONS.top);
      const frontOk = checkView(frontGrid.lines, TARGET_SOLUTIONS.front);
      const rightOk = checkView(rightGrid.lines, TARGET_SOLUTIONS.right);

      const feedback = document.getElementById('feedback');

      if (topOk && frontOk && rightOk) {
        feedback.style.color = '#2f855a';
        feedback.innerText = '🎉 Correct! All views drawn properly.';
      } else {
        feedback.style.color = '#c53030';
        let errors = [];
        if (!topOk) errors.push('Top');
        if (!frontOk) errors.push('Front');
        if (!rightOk) errors.push('Right');
        feedback.innerText = '❌ Incorrect view(s): ' + errors.join(', ');
      }
    }

    document.getElementById('checkBtn').addEventListener('click', checkAnswer);
    document.getElementById('clearAllBtn').addEventListener('click', () => {
      topGrid.clear();
      frontGrid.clear();
      rightGrid.clear();
      document.getElementById('feedback').innerText = '';
    });
  </script>
</body>
</html>
